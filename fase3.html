<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu regalo 🎁</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stars"></div>
  <div class="container fade-in">
    <div class="gift-box">
      <p>Haz clic en la caja para abrir tu regalo 🎁</p>
      <button id="abrirCaja">📦 Abrir caja</button>

      <img id="regalo" src="regalo.jpg" alt="Regalo" style="display:none; max-width:90%; border-radius:12px; margin-top:20px;">
      <a id="descargar" href="regalo.jpg" download="Regalo_Melanie.jpg" style="display:none;" class="download-btn">Descargar imagen</a>
    </div>
  </div>

  <audio id="bgMusic" src="musica.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
